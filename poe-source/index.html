<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; object-src 'none'">
  <title>Repo Crystal Rally</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <main id="repo-crystal-arena">
    <h1>Repo Crystal Rally</h1>

    <p id="player-two">Player 2 crystal paddle: waiting</p>

</html>
